          - type: paragraph
            text: >-
              Now, before we move to the next status, it's time to pause and test your knowledge.
          - type: paragraph
            text: >-
              Alright, shall we begin?
        - type: question
          cta: NEXT
          blocks:
          - type: paragraph
            text: >-
              How frequently should you weight in?
          question:
            response: single_choice
            graded: false
            options: [Everyday, Once a week., Once a month, It's a nightmare]
        - type: question
          cta: NEXT
          blocks:
          - type: paragraph
            text: >-
              What is calorie density?
          question:
            response: single_choice
            graded: true
            options:
            - { label: The total calories I eat in one day }
            - { label: The number of calories in a food per gram of its weight, correct: true }
            - { label: How quickly my body burns calories after eating }
            explanation: >-
              Calorie density tells you how many calories are packed into each gram of a food.
        - type: question
          cta: NEXT
          blocks:
          - type: paragraph
            text: >-
              Which food zone is the "free zone"?
          question:
            response: single_choice
            graded: true
            options:
            - { label: Zone 1, correct: true }
            - { label: Zone 2 }
            - { label: Zone 3 }
            - { label: Zone 4 }
            explanation: >-
              Zone 1 foods are high in water and fibre and low in calories, so you're free to eat as much as you want.
        - type: question
          cta: NEXT
          blocks:
          - type: paragraph
            text: >-
              What is visual hunger?
          question:
            response: single_choice
            graded: true
            options:
            - { label: Feeling hungry because you skipped a meal }
            - { label: "Wanting to eat because you see tasty food, even when you're not hungry", correct: true }
            - { label: Feeling full just by looking at food }
            explanation: >-
              Seeing tasty food makes your brain signal a desire to eat — even if you're not at hunger level 3.
        - type: content
          cta: FINISH
          blocks:
          - type: paragraph
            text: >-
              ==**Great job, {{user.name}}!**== You've revised the most important ideas from the Beginner status.
          - type: paragraph
            text: >-
              Next up: **Insider** — where you'll learn to handle your food triggers.

